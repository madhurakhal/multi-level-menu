<div class="colors-area">
  <app-item-selector
    title="Colors"
    [options]="possibleColors()"
    [(selectedOption)]="selectedColor"
  >
  
  <div class="color-selector" 
    [style.--option-color]="color"
  
  *appItemContainer="let color; let selected=isSelected; let select= onSelect"
  (click)="select(color)"
  >
    <span [style.color]="color" [class.is-selected]="selected">{{color}}</span>
  </div>

</app-item-selector>
</div>

<div class="fonts-area">
  <app-item-selector
    title="Font"
    [options]="possibleFonts()"
    [(selectedOption)]="selectedFont"
  >
    <span *appItemTemplate="let value;" [style.font-family]="value">{{value}}</span>

</app-item-selector>
</div>

<div class="sizes-area">
  <app-item-selector
    title="Size"
    [options]="possibleSizes()"
    [(selectedOption)]="selectedSize"
  >
  <span *appItemTemplate="let value;" [style.font-size]="value">{{value}}</span>  
</app-item-selector>
</div>

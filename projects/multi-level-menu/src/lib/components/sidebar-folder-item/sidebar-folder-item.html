<div>
    @if(hasTemplate()) {
    <ng-container *ngTemplateOutlet="sideBarFolderTemplate()
            ;context: {
                $implicit: folder(),
                toggle: toggle.bind(this),
                isExpanded: isExpanded(),
                toggleFolder: toggleFolder.bind(this),
                atLeastOneChecked: atLeastOneChecked
            }">
    </ng-container>

    }@else {
    <div class="side-bar-folder-container">
        <div class="side-bar-folder-header">
            <input type="checkbox" [checked]="folder().checked" (click)="toggleFolder($event)" />
            <div class="side-bar-folder-header-title">
                <span>{{ folder().title }}</span>
            </div>
            <div class="side-bar-folder-header-icon" (click)="toggle()">
                <span class="material-symbols-outlined">
                    {{ isExpanded() ? 'expand_less' : 'expand_more' }}
                </span>
            </div>
        </div>
    </div>
    }

    @if(hasMenuOrFolders()) {
    <div [class.hidden]="!isExpanded()">
        <ul class="innter-side-bar-folder-menu">
            @if(hasFolders()) {
            @for (folder of folders(); track folder.foldder_id) {
            <li>
                <sidebar-folder-item [folder]="folder" (folderUpdated)="handleFolderUpdate($event)"
                    [sideBarFolderTemplate]="sideBarFolderTemplate()">

                </sidebar-folder-item>
            </li>
            }
            }
            @if(hasMenuItems()) {
            @for (item of menuItems(); track item.id) {
            <li>
                <sidebar-list-item [item]="item" (itemChanged)="handleItemChanged(item, $event)"></sidebar-list-item>
            </li>
            }
            }
        </ul>
    </div>

    }
</div>

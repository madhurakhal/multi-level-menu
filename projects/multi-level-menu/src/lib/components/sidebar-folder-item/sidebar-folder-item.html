@if(hasTemplate()) {
<ng-container *ngTemplateOutlet="folderTemplate()
            ;context: {
                $implicit: folder(),
                toggle: toggle.bind(this),
                isExpanded: isExpanded(),
                toggleFolder: toggleFolder.bind(this),
                atLeastOneChecked: atLeastOneChecked
            }">
</ng-container>

}@else {
<div class="side-bar-folder-header" role="treeitem" [attr.aria-expanded]="hasMenuOrFolders() ? isExpanded() : null">
    <input type="checkbox" class="sidebar-checkbox" [checked]="folder().checked" [indeterminate]="isIndeterminate()"
        [attr.aria-label]="'Select ' + folder().title" (change)="toggleFolder($event)" />
    <span class="material-symbols-outlined folder-icon" aria-hidden="true">
        {{ isExpanded() ? 'folder_open' : 'folder' }}
    </span>
    <button type="button" class="side-bar-folder-header-title" (click)="toggle()">
        <span>{{ folder().title }}</span>
    </button>
    <button type="button" class="side-bar-folder-header-icon" [attr.aria-label]="(isExpanded() ? 'Collapse ' : 'Expand ') + folder().title" (click)="toggle()">
        <span class="material-symbols-outlined expand-arrow">
            {{ isExpanded() ? 'expand_less' : 'expand_more' }}
        </span>
    </button>
</div>
}

@if(hasMenuOrFolders()) {
<ul class="inner-sidebar-folder-menu" role="group" [class.hidden]="!isExpanded()">
    @if(hasFolders()) {
    @for (folder of folders(); track folder.folder_id) {
    <li>
        <sidebar-folder-item [folder]="folder" (folderChange)="handleFolderUpdate($event)"
            [folderTemplate]="folderTemplate()"
            [itemTemplate]="itemTemplate()"
            (itemChanged)="handleMenuItemChanged($event)">

        </sidebar-folder-item>
    </li>
    }
    }
    @if(hasMenuItems()) {
    @for (item of menuItems(); track item.id) {
    <li>
        <sidebar-list-item [item]="item" (itemChange)="handleItemChanged($event)"
            [itemTemplate]="itemTemplate()">
        ></sidebar-list-item>
    </li>
    }
    }
</ul>

}

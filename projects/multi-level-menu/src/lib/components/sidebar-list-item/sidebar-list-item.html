@if(hasTemplate()) {
    <ng-container *ngTemplateOutlet="itemTemplate(); context: { $implicit: item(), isChecked: item().checked, select: select.bind(this) }"></ng-container>
}@else {
<input type="checkbox" class="sidebar-checkbox" [checked]="item().checked" (click)="select($event)"/>
<div class="side-bar-item-content" (click)="select($event)">
    <span class="material-symbols-outlined file-icon">description</span>
    <span class="side-bar-item-title">{{ title() }}</span>
</div>
}
